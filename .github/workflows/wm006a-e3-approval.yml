name: wm006a E3 approval (guest) + boot activation

# Manual only. Boot-activation check of the wm006a sockets, then the guest portion of E3 using the
# separate lab approval fixture in wm006a-lab/e3 (fictional plans, inert records). Physical-console
# trust is a separate test. Synthetic data only.
on:
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version for the guest (blank = newest stable)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: wm006a-e3
  cancel-in-progress: false

jobs:
  e3:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FEDORA_VERSION: ${{ inputs.fedora_version }}
      SKIP_DESKTOP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: E3 fixture local protocol test
        run: |
          mkdir -p "$RUNNER_TEMP/e3"
          python3 -I wm006a-lab/e3/test_local.py wm006a-lab/e3/wm006a-e3 | tee "$RUNNER_TEMP/e3/local-test.txt"

      - name: Check and enable KVM
        run: bash scripts/host/enable-kvm.sh

      - name: Free disk space
        run: bash scripts/host/free-disk.sh

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils skopeo podman
          mkdir -p "$WORK/results/wm006a" && cp "$RUNNER_TEMP/e3/local-test.txt" "$WORK/results/wm006a/e3-local-test.txt"
          awk '{s=$1; $1=""; sub(/^ /,""); n=$1; $1=""; sub(/^ /,""); if (s=="PASS"||s=="FAIL") printf "%s\te3-local\t%s\t%s\n", s, n, $0}' \
            "$RUNNER_TEMP/e3/local-test.txt" > "$WORK/results/wm006a/build-results.tsv"

      - name: Resolve Kinoite image
        run: bash scripts/host/resolve-image.sh

      - name: Build Kinoite disk image
        run: bash scripts/host/build-image.sh

      - name: Build wm006a native binary
        run: bash wm006a-lab/host/build-artifacts.sh

      - name: Run boot check and E3 in the VM
        run: bash wm006a-lab/host/run-e3.sh

      - name: Summarize results
        if: always()
        run: bash wm006a-lab/host/summarize.sh

      - name: Validation gate (E3 required checks)
        if: always()
        run: bash wm006a-lab/host/gate.sh wm006a-lab/required-checks-e3.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wm006a-e3-results
          path: ${{ env.WORK }}/results/wm006a
          if-no-files-found: warn
          retention-days: 30
